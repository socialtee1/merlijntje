<style>
  :root{
    --accent:#A9DDF5;
    --accent-hover:#7FC8EA;
    --midnight:#0F1B33;
    --ivory:#F3EEE4;
    --champagne:#B8975F;
    --font-display:'Manrope', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{
    height:100%;
    max-width:100%;
    overflow-x:hidden;
    overscroll-behavior-x:none;
  }
  body{
    margin:0;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(30,56,102,.35), transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(184,151,95,.08), transparent 50%),
      var(--midnight);
    color:var(--ivory);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    width:100%;
    position:relative;
  }
  .top{
    display:flex; align-items:center; justify-content:space-between;
    padding:1.5rem clamp(1.25rem,4vw,3rem);
    padding-top:max(1.5rem, env(safe-area-inset-top));
    gap:1rem;
  }
  .back{
    display:inline-flex; align-items:center; gap:.5rem;
    color:rgba(243,238,228,.75);
    font-size:.9rem;
    text-decoration:none;
  }
  .back:hover{color:var(--ivory);}
  main{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:2rem clamp(1.25rem,4vw,3rem) 4rem;
    position:relative;
  }
  .hero-logo{
    height:clamp(72px,12vw,120px);
    margin-bottom:1.8rem;
  }
  .hero-logo svg{
    height:100%;
    width:auto;
    display:block;
    margin:0 auto;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:.5rem;
    font-family:'Instrument Sans', var(--font-body);
    font-size:.75rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
    color:var(--champagne);
    margin-bottom:1.4rem;
  }
  .eyebrow::before{content:""; width:20px; height:1px; background:currentColor; display:inline-block;}
  h1{
    font-family:'Instrument Serif', Georgia, serif;
    font-weight:400;
    letter-spacing:-.01em;
    font-size:clamp(2.4rem,7vw,5rem);
    line-height:1.03;
    margin:0;
  }
  h1 em{
    font-style:italic;
    color:#D8CDBA;
  }
  main p{
    margin:1.3rem 0 0;
    max-width:520px;
    font-size:clamp(1rem,1.6vw,1.15rem);
    color:rgba(243,238,228,.78);
    line-height:1.6;
  }
  .soon-badge{
    display:inline-flex; align-items:center; gap:.6rem;
    margin-top:2.2rem;
    padding:.9rem 1.5rem;
    border-radius:999px;
    font-weight:700; font-size:.85rem; letter-spacing:.06em; text-transform:uppercase;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:var(--ivory);
  }
  .soon-badge .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--champagne);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:.4; transform:scale(.75);}
  }
  .camper-svg{
    width:min(90%, 460px);
    margin:2.5rem auto 0;
    opacity:.9;
  }
  .cta{
    display:inline-flex; align-items:center; gap:.6rem;
    margin-top:2.5rem;
    padding:1rem 1.8rem;
    border-radius:999px;
    font-weight:600; font-size:.95rem;
    background:var(--ivory);
    color:var(--midnight);
    text-decoration:none;
    transition:transform .3s cubic-bezier(.16,1,.3,1), background .25s ease;
  }
  .cta:hover{transform:translateY(-2px); background:#fff;}
  footer{
    text-align:center;
    padding:1.5rem;
    font-size:.8rem;
    color:rgba(243,238,228,.4);
  }
  @media (max-width:640px){
    .top{
      padding:12px 22px;
      padding-top:calc(env(safe-area-inset-top, 0px) + 10px);
    }
    .hero-logo{height:68px; margin-bottom:1.2rem;}
    main{padding:1.25rem 22px calc(2rem + env(safe-area-inset-bottom, 0px));}
    h1{font-size:clamp(1.9rem, 9vw, 2.6rem);}
    main p{font-size:.98rem; max-width:none;}
    .soon-badge{flex-wrap:wrap; justify-content:center; text-align:center; font-size:.72rem; line-height:1.4; padding:.8rem 1rem;}
    .cta{width:100%; justify-content:center; box-sizing:border-box;}
    footer{padding:1.1rem 22px calc(1.1rem + env(safe-area-inset-bottom, 0px));}
  }
  @media (prefers-reduced-motion: reduce){
    .soon-badge .dot{animation:none;}
  }
