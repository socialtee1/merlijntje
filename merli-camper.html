<style>
  :root{
    --accent:#A9DDF5;
    --accent-hover:#7FC8EA;
    --font-display:'Manrope', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(169,221,245,.10), transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(255,255,255,.06), transparent 50%),
      #0b0b0d;
    color:#fff;
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .top{
    display:flex; align-items:center; justify-content:space-between;
    padding:1.5rem clamp(1.25rem,4vw,3rem);
    padding-top:max(1.5rem, env(safe-area-inset-top));
  }
  .back{
    display:inline-flex; align-items:center; gap:.5rem;
    color:rgba(255,255,255,.75);
    font-size:.9rem;
    text-decoration:none;
  }
  .back:hover{color:#fff;}
  .brand{
    font-family:var(--font-display); font-weight:800; font-size:1.1rem; letter-spacing:-.01em;
  }
  main{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:2rem clamp(1.25rem,4vw,3rem) 4rem;
    position:relative;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:.5rem;
    font-size:.75rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent);
    margin-bottom:1.4rem;
  }
  .eyebrow::before{content:""; width:20px; height:2px; background:var(--accent-hover); display:inline-block;}
  h1{
    font-family:var(--font-display);
    font-weight:800;
    letter-spacing:-.02em;
    font-size:clamp(2.4rem,7vw,5rem);
    line-height:1.03;
    margin:0;
  }
  main p{
    margin:1.3rem 0 0;
    max-width:480px;
    font-size:clamp(1rem,1.6vw,1.15rem);
    color:rgba(255,255,255,.75);
    line-height:1.6;
  }
  .soon-badge{
    display:inline-flex; align-items:center; gap:.6rem;
    margin-top:2.2rem;
    padding:.9rem 1.5rem;
    border-radius:999px;
    font-weight:700; font-size:.85rem; letter-spacing:.06em; text-transform:uppercase;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
  }
  .soon-badge .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:.4; transform:scale(.75);}
  }
  .camper-svg{
    width:min(90%, 460px);
    margin:2.5rem auto 0;
    opacity:.9;
  }
  .cta{
    display:inline-flex; align-items:center; gap:.6rem;
    margin-top:2.5rem;
    padding:1rem 1.8rem;
    border-radius:999px;
    font-weight:600; font-size:.95rem;
    background:var(--accent);
    color:#111;
    text-decoration:none;
    transition:transform .3s cubic-bezier(.16,1,.3,1), background .25s ease;
  }
  .cta:hover{transform:translateY(-2px); background:var(--accent-hover);}
  footer{
    text-align:center;
    padding:1.5rem;
    font-size:.8rem;
    color:rgba(255,255,255,.4);
  }
  @media (max-width:640px){
    main{padding:1.4rem 1.15rem calc(2.5rem + env(safe-area-inset-bottom));}
    h1{font-size:clamp(2rem, 11vw, 3.1rem);}
    .soon-badge{flex-wrap:wrap; justify-content:center; text-align:center; font-size:.75rem; line-height:1.4;}
    .cta{width:100%; justify-content:center;}
  }
  @media (prefers-reduced-motion: reduce){
    .soon-badge .dot{animation:none;}
  }
</style>
</head>
<body>

<div class="top">

    <rect x="130" y="106" width="46" height="30" rx="4" stroke="#A9DDF5" stroke-width="2.5" opacity=".6"/>
